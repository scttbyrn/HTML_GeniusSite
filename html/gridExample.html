<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Grid Example</title>
  <link rel="stylesheet" href="gridstyle.css">
</head>
<body>

  <section class="charts-section">
    <h2>Top Songs Grid</h2>

    <!-- Grid Container -->
    <div class="song-grid">
      <div class="song-card featured">
        <span class="rank">1</span>
        <div>
          <h3>I Ain’t Mad At Cha</h3>
          <p>2Pac</p>
        </div>
      </div>

      <div class="song-card">
        <span class="rank">2</span>
        <div>
          <h3>California Love</h3>
          <p>2Pac ft. Dr. Dre</p>
        </div>
      </div>

      <div class="song-card">
        <span class="rank">3</span>
        <div>
          <h3>Ambitionz Az A Ridah</h3>
          <p>2Pac</p>
        </div>
      </div>

      <div class="song-card">
        <span class="rank">4</span>
        <div>
          <h3>Hit 'Em Up</h3>
          <p>2Pac</p>
        </div>
      </div>

      <div class="song-card">
        <span class="rank">5</span>
        <div>
          <h3>Changes</h3>
          <p>2Pac</p>
        </div>
      </div>
    </div>
  </section>

</body>
</html>
